# CI — push·PR마다 타입 검증 → 테스트 → 빌드. 하나라도 실패하면 머지·배포하지 않는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Core 는 별도(비공개) 저장소다. 토큰이 없으면 계약 검사는 **건너뛰고**, 건너뛴 검사를
    # 통과로 적지 않는다. 토큰 등록은 [승인 필요].
    env:
      AICC_CORE_TOKEN: ${{ secrets.AICC_CORE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검증
        run: npm run typecheck

      - name: 테스트 (정적 계약 + 런타임 동작)
        run: npm test
        env:
          ADMIN_PERSIST: 'false'

      - name: 빌드
        run: npm run build
        env:
          # 실키·실연동은 CI에서 활성화하지 않는다(build now, activate on approval).
          CHAT_LLM_LIVE: 'false'
          ADMIN_AUTH_REQUIRED: 'false'

      - name: 라우트 export 규칙 검사
        # route.ts에 HTTP 메서드·설정 외 export가 있으면 Next 빌드가 깨진다. 빌드가 통과해도 재확인한다.
        run: |
          set -e
          fail=0
          for f in $(find src/app -name route.ts); do
            for name in $(grep -oE "^export (const|function|async function) [A-Za-z_]+" "$f" | awk '{print $NF}'); do
              case "$name" in
                GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|dynamic|revalidate|runtime|maxDuration) ;;
                *) echo "::error file=$f::허용되지 않은 export: $name"; fail=1 ;;
              esac
            done
          done
          exit $fail

      # ── AICC-Core 채널 계약 ──────────────────────────────────────────────
      # 챗봇이 Core 를 실제로 소비하므로, Core 의 적합성 스위트를 이 저장소 포트에 대고 돌린다.
      # 드라이런 전용이라 실메신저로 아무것도 나가지 않는다(ci/aicc-port.mjs 는 transport 미주입).
      - name: AICC-Core 체크아웃 (채널 계약 검사용)
        id: aicc_core
        if: env.AICC_CORE_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: AI-JUNE/aicc-core
          path: .aicc-core
          token: ${{ secrets.AICC_CORE_TOKEN }}

      - name: 채널 계약 적합성 (드라이런 · 종료코드 0/1/2 그대로 게이트)
        if: steps.aicc_core.outcome == 'success'
        run: npm run conformance:aicc
        env:
          AICC_CORE: .aicc-core
