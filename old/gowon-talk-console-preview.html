<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GOWON Talk · 운영 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
:root{--ink:#0B1024;--side:#0A0E20;--paper:#F6F4EF;--card:#fff;--line:#E7E3D9;--line2:#EFEDE7;
--indigo:#5B53E8;--indigoS:#EEEDFE;--sub:#8A8578;--sub2:#A8A398;--tx:#1A1714;--ok:#15803D;--okS:#EAF3EE;--amber:#B45309;--amberS:#FBF0DD;--blue:#185FA5;--blueS:#E6F1FB;
--disp:'Jost','Pretendard Variable',Pretendard,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;background:var(--paper);color:var(--tx);-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
aside{width:222px;background:var(--side);color:#fff;padding:18px 13px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:8px;padding:8px 6px 18px;font-family:var(--disp);font-weight:500;font-size:19px;letter-spacing:.07em}
.brand img{height:23px}.brand .ac{color:#A9B4FF;letter-spacing:0;font-family:"Pretendard",sans-serif;font-weight:600}
.nhdr{font-family:var(--disp);font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.38);font-weight:500;padding:13px 10px 5px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;font-size:13.5px;color:rgba(255,255,255,.72);cursor:pointer;transition:background .22s,color .22s}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:rgba(91,83,232,.2);color:#fff;font-weight:600}.nav.on svg{stroke:#A9B4FF}
.nav svg{width:17px;height:17px;stroke:rgba(255,255,255,.5);flex-shrink:0}
.badge{margin-left:auto;background:#5B53E8;color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;font-family:var(--disp)}
.sfoot{margin-top:auto;font-size:10.5px;color:rgba(255,255,255,.38);padding:10px;line-height:1.6;border-top:1px solid rgba(255,255,255,.08)}
main{flex:1;padding:26px 30px;overflow:auto}
.view{animation:fade .4s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:24px;font-weight:600;letter-spacing:-.02em}.desc{color:var(--sub);font-size:13.5px;margin:5px 0 22px}
.lbl{font-family:var(--disp);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--sub2);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}
.kpi .v{font-family:var(--disp);font-size:30px;font-weight:500;letter-spacing:-.01em;margin-top:6px}
.pill{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;outline:none;background:#fff;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,83,232,.1)}
label{font-size:12px;font-weight:600;color:var(--sub);display:block;margin:13px 0 5px}
button{font:inherit;cursor:pointer;border:none}
.btn{background:var(--indigo);color:#fff;padding:9px 15px;border-radius:9px;font-size:13.5px;font-weight:600;transition:transform .14s var(--ease),filter .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--tx)}.btn.ghost:hover{background:var(--paper)}
.btn.dark{background:var(--ink)}.btn.sm{padding:7px 11px;font-size:12.5px}
.row{display:flex;gap:10px;align-items:center}
.login{max-width:380px;margin:90px auto;text-align:center}.hide{display:none}
.bar{height:8px;border-radius:20px;background:var(--line2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--indigo);border-radius:20px;transition:width 1s var(--ease)}
/* INBOX */
.inbox{display:grid;grid-template-columns:296px minmax(0,1fr) 264px;height:calc(100vh - 52px);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.ibx-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ibx-filters{display:flex;gap:5px;padding:12px 12px 8px;flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.ftab{font-size:12px;padding:5px 10px;border-radius:20px;cursor:pointer;color:var(--sub);background:var(--paper)}
.ftab.on{background:var(--ink);color:#fff;font-weight:600}
.ibx-search{padding:10px 12px;border-bottom:1px solid var(--line2)}
.ibx-rows{overflow:auto;flex:1}
.crow{padding:13px 14px;border-bottom:1px solid var(--line2);cursor:pointer;transition:background .15s}
.crow:hover{background:var(--paper)}.crow.on{background:var(--indigoS)}
.crow .top{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.crow .nm{font-weight:600;font-size:13.5px}.crow .pv{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .tm{font-size:10.5px;color:var(--sub2);font-family:var(--disp);margin-left:auto;flex-shrink:0}
.ibx-thread{display:flex;flex-direction:column;min-height:0}
.th-head{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.th-head .nm{font-weight:600;font-size:15px}
.th-body{flex:1;overflow:auto;padding:18px;background:var(--paper)}
.msg{max-width:74%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;margin-bottom:5px}
.msg.them{background:#fff;border:1px solid var(--line)}
.msg.me{color:#fff;margin-left:auto;background:var(--indigo)}
.msg.ag{margin-left:auto;background:var(--ink);color:#fff}
.mwrap{margin-bottom:12px}.mwrap.r{text-align:right}
.mmeta{font-size:10.5px;color:var(--sub2);margin:0 3px 4px;font-family:var(--disp);letter-spacing:.04em}
.itag{display:inline-block;font-size:10px;font-weight:600;color:var(--indigo);background:var(--indigoS);padding:1px 7px;border-radius:6px;margin-left:6px}
.composer{border-top:1px solid var(--line2);padding:12px 14px}
.macros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.macro{font-size:11.5px;color:var(--sub);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:4px 10px;cursor:pointer}
.macro:hover{border-color:var(--indigo);color:var(--indigo)}
.cmp-row{display:flex;gap:8px;align-items:flex-end}
.cmp-row textarea{resize:none;height:42px}
.slash-box{position:absolute;left:14px;right:14px;bottom:100%;margin-bottom:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px -10px rgba(20,20,50,.25);overflow:hidden;display:none;z-index:5}
.slash-it{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:1px}
.slash-it:hover{background:var(--paper)}.slash-it b{font-size:13px}.slash-it span{font-size:11.5px;color:var(--sub)}
/* 실시간 모니터링 */
.livedot{width:8px;height:8px;border-radius:50%;background:#22C55E;display:inline-block;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:lp 1.6s infinite}
@keyframes lp{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.mon-kpi{background:var(--ink);color:#fff;border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.mon-kpi .v{font-family:var(--disp);font-size:32px;font-weight:600;letter-spacing:-.01em}
.mon-kpi .l{font-size:12px;color:rgba(255,255,255,.6)}
.mon-kpi.flash{animation:fl .6s}@keyframes fl{0%{background:#241F4D}100%{background:var(--ink)}}
.agent-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2)}
.gauge{position:relative;width:120px;height:120px;margin:0 auto}
.feed{height:260px;overflow:hidden;display:flex;flex-direction:column;gap:7px}
.feed-it{display:flex;gap:9px;align-items:center;font-size:12.5px;padding:8px 10px;border-radius:9px;background:var(--paper);animation:slidein .4s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.watch{border:1px solid var(--line);border-radius:14px;height:360px;display:flex;flex-direction:column;overflow:hidden}
.watch .wb{flex:1;overflow:auto;padding:14px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.kdelta{font-size:11px;color:var(--sub);margin-top:6px}.kdelta.up{color:var(--ok)}
.ibx-ctx{border-left:1px solid var(--line);padding:18px 16px;overflow:auto;background:#fff}
.ctx-h{font-family:var(--disp);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--sub2);margin:16px 0 8px;font-weight:500}
.ctx-h:first-child{margin-top:0}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}.kv span{color:var(--sub)}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:12px;font-family:var(--disp)}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--sub);font-size:13.5px}
/* builder/billing reuse */
.toggle{position:relative;width:42px;height:24px;border-radius:20px;background:var(--line);cursor:pointer;transition:background .25s}
.toggle.on{background:var(--indigo)}.toggle b{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .25s var(--ease)}.toggle.on b{left:21px}
.swatch{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:transform .15s}.swatch:hover{transform:scale(1.1)}.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--tx)}
.plan{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;transition:transform .25s var(--ease),box-shadow .25s}
.plan:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(40,40,90,.22)}
.plan.cur{border:2px solid var(--indigo)}.plan .pr{font-family:var(--disp);font-size:30px;font-weight:500;margin:8px 0}
.plan ul{list-style:none;margin:14px 0 18px;display:flex;flex-direction:column;gap:9px;flex:1;font-size:13px;color:#3A352E}
.plan li{display:flex;gap:8px}.plan li svg{color:var(--indigo);flex-shrink:0}
.prev{background:var(--ink);border-radius:16px;overflow:hidden;border:1px solid var(--line)}.prev .top{padding:11px 14px;color:#fff;font-weight:600;font-size:13px}.prev .body{padding:14px;min-height:120px}
.bub{max-width:80%;padding:9px 12px;border-radius:13px;font-size:13.5px;line-height:1.5;margin-bottom:8px}.them2{background:var(--paper);border:1px solid var(--line)}.me2{color:#fff;margin-left:auto}
code,pre{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--sub);padding:8px 6px}td{padding:9px 6px;border-top:1px solid var(--line2)}
body.gt-dark{--paper:#10131C;--card:#1A1E2B;--line:#2A2F3E;--line2:#242838;--tx:#E8EAF0;--sub:#9AA0B0;--sub2:#6E7486}
body.gt-dark .kpi,body.gt-dark .card,body.gt-dark .inbox,body.gt-dark .plan{background:var(--card)}
body.gt-dark input,body.gt-dark textarea,body.gt-dark select{background:#11141E;color:#E8EAF0}
body.gt-dark .th-body,body.gt-dark .ftab{background:#13161F}
</style>
</head>

const FEED_EVENTS=[["인입","#5B53E8","새 문의 인입"],["AI","#15803D","AI 자동응답 완료"],["인계","#B45309","상담사 인계 요청"],["종료","#6B7280","상담 종료·요약 저장"],["해결","#15803D","AI가 문의를 해결"],["전달","#185FA5","다른 상담사로 전달"]];

function stColor(s){return ({online:"#22C55E",away:"#F59E0B",off:"#9CA3AF"})[s];}
function stLabel(s){return ({online:"배분중",away:"부재중",off:"중지"})[s];}
function startMon(){
  MON.tick=0;
  renderAgentBoard();renderActiveList();
  for(let i=0;i<4;i++)setTimeout(()=>pushFeed(),i*400);
  monTick();
  MON.timer=setInterval(monTick,1000);
}
function monTick(){
  MON.tick++;
  const t=document.getElementById("montime");if(!t){clearInterval(MON.timer);MON.timer=null;return;}
  t.textContent=new Date().toLocaleTimeString("ko-KR");
  // 활성 대화 경과시간 갱신
  document.querySelectorAll("[data-since]").forEach(el=>{const s=+el.dataset.since;const sec=Math.floor((Date.now()-s)/1000);el.textContent=(sec>=60?Math.floor(sec/60)+"분 ":"")+(sec%60)+"초";});
  // 3~4초마다 지표 재계산 + 피드
  if(MON.tick%3===0){
    const cs=MON.convs||[];
    const queue=cs.filter(c=>c.status==="needs_human").length+(MON.tick%6===0?1:0);
    const active=cs.filter(c=>c.status==="agent"||c.status==="ai_handling").length;
    const online=(MON.agents||[]).filter(a=>a.state==="online").length;
    const resp=6+(MON.tick%5);
    setKpi("k-queue",queue);setKpi("k-active",active);setKpi("k-agents",online);setKpi("k-resp",resp);
    const total=cs.length||12,done=cs.filter(c=>c.status==="resolved").length||7,wait=queue;
    const sla=Math.min(99,82+(MON.tick%8));
    const c=document.getElementById("slaC"),p=document.getElementById("slaP");
    if(c){c.style.transition="stroke-dashoffset .8s var(--ease)";c.style.strokeDashoffset=314-314*sla/100;p.textContent=sla+"%";}
    setTxt("m-done",done);setTxt("m-wait",wait);setTxt("m-total",total);
  }
  if(MON.tick%4===0)pushFeed();
  if(MON.watch&&MON.tick%3===0)refreshWatch();
}
function setKpi(id,val){const el=document.querySelector("#"+id+" .v");if(!el)return;const cur=+el.textContent.replace(/\D/g,"")||0;if(cur!==val){el.parentElement.classList.add("flash");setTimeout(()=>el.parentElement.classList.remove("flash"),600);}animNum(el,cur,val);}
function setTxt(id,v){const el=document.getElementById(id);if(el)el.textContent=v;}
function animNum(el,a,b){let t0=null;function s(t){if(!t0)t0=t;const p=Math.min((t-t0)/500,1);el.textContent=Math.round(a+(b-a)*p);if(p<1)requestAnimationFrame(s);}requestAnimationFrame(s);}
