# 매일 E2E 스모크 — 배포된 라이브 서비스에 실제 요청을 보내 핵심 흐름을 확인한다.
# QUALITY_BAR §5 "매일 E2E 스모크 검증이 라이브 서비스에 실제 요청을 보내 동작을 확인" 이행.
# 읽기 경로와 대화 API만 호출하고 개인정보를 보내지 않는다(scripts/smoke.mjs 참고).
name: Smoke (live)

on:
  schedule:
    - cron: '0 22 * * *' # 매일 07:00 KST
  workflow_dispatch:
    inputs:
      base_url:
        description: '검사 대상(미입력 시 라이브)'
        required: false
        default: ''

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 의존성 없이 도는 스크립트다(npm ci 불필요 → 매일 도는 작업을 가볍게 유지).
      - name: 스모크 실행
        # 종료코드 1(검사 실패)과 2(대상 접속 불가) 모두 실패로 본다 —
        # 라이브가 응답하지 않는 것 자체가 장애이므로 조용히 넘기지 않는다.
        run: node scripts/smoke.mjs
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url || vars.SMOKE_BASE_URL || 'https://chatbot-gowon.vercel.app' }}
